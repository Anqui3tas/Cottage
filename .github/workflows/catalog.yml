name: Catalog

on:
  push:
    branches: [main]
    paths:
      - "Artists/**"
      - "Scripts/build_catalog.py"
  pull_request:
    paths:
      - "Artists/**"
      - "Scripts/build_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pull requests are validated only; nothing is committed.
      - name: Build catalog
        run: python3 Scripts/build_catalog.py . --repository "${{ github.repository }}"

      - name: Commit catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update catalog"
          git push
